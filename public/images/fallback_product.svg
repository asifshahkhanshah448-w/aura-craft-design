<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d6d3d1" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#auraBg)" />
  <rect width="800" height="600" fill="url(#gridPattern)" />
  
  <g transform="translate(400, 260)">
    <!-- Elegant craft emblem -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="38" fill="#fafaf9" stroke="#78716c" stroke-width="1" />
    <path d="M -16 6 L 0 -20 L 16 6 Z" fill="none" stroke="#44403c" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#44403c" stroke-width="1.5" />
    
    <!-- Typography -->
    <text x="0" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#292524">AURA CRAFT</text>
    <text x="0" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1" fill="#78716c">CURATED OBJECT</text>
  </g>
</svg>
